name: ci

# Build verification only. Distribution lives in release.yml, which runs on tags
# alone - keep every publish/upload step out of this workflow.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build-${{ matrix.platform }}
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64, ARM64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build RoundedTB.sln -c Release -p:Platform=${{ matrix.platform }}
