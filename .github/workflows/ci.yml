name: ci

# Build verification only. Distribution lives in release.yml, which runs on tags
# alone - keep every publish/upload step out of this workflow. It runs pull requests'
# code, so it gets no secrets and a read-only token.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build-${{ matrix.platform }}
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64, ARM64]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build RoundedTB.sln -c Release -p:Platform=${{ matrix.platform }}
