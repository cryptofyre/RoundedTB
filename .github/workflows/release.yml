name: release

# Tag-driven only. A normal push must never reach this workflow - ci.yml is the
# one that runs on every push, and it stays build-verification only.
#
#   v*         -> published release
#   canary*    -> published pre-release
#   manual run -> draft release, for checking the artifacts before anything goes public
on:
  push:
    tags:
      - 'v*'
      - 'canary*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to build as (used for the archive name only)'
        required: true
        default: 'canary-test'

permissions:
  contents: write   # required to create the release; the default read gives 403

jobs:
  build:
    name: build-${{ matrix.rid }}
    runs-on: windows-latest
    strategy:
      matrix:
        # ARM64 is built explicitly: upstream has never shipped it, and the app runs
        # natively on Windows on Arm. Cross-publishing from the x64 runner is fine for
        # a self-contained .NET app.
        rid: [win-x64, win-arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve tag
        id: ver
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      # Self-contained, single file. Compression is not optional here: without it the
      # exe is ~177 MB instead of ~79 MB. Trimming is unavailable - WPF does not support it.
      - name: Publish (self-contained)
        run: >
          dotnet publish RoundedTB/RoundedTB.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o publish/RoundedTB

      # Five native WPF DLLs stay outside the single file, so shipping the bare exe
      # produces something that does not start. Always archive the whole folder.
      - name: Archive
        shell: pwsh
        run: |
          Compress-Archive -Path publish/RoundedTB -DestinationPath "RoundedTB_${{ steps.ver.outputs.tag }}_${{ matrix.rid }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoundedTB-${{ matrix.rid }}
          path: RoundedTB_*_${{ matrix.rid }}.zip
          if-no-files-found: error

  release:
    name: create-release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Resolve tag
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then tag="${{ inputs.tag }}"; else tag="${{ github.ref_name }}"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: RoundedTB-*
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: ${{ startsWith(steps.ver.outputs.tag, 'canary') }}
          generate_release_notes: true
          body: |
            Self-contained builds - no .NET runtime needed.

            | Download | For |
            |---|---|
            | `RoundedTB_${{ steps.ver.outputs.tag }}_win-x64.zip` | Most PCs (Intel / AMD) |
            | `RoundedTB_${{ steps.ver.outputs.tag }}_win-arm64.zip` | Windows on Arm (Snapdragon etc.) |

            Extract the whole `RoundedTB` folder and run `RoundedTB.exe`; the exe
            will not start on its own without the DLLs next to it.

            The binary is unsigned, so SmartScreen will warn on first run.
          files: RoundedTB_*.zip
          fail_on_unmatched_files: true
