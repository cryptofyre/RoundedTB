name: release

# Tag-driven only. A normal push must never reach this workflow - ci.yml is the
# one that runs on every push, and it stays build-verification only.
#
#   v*         -> published release, with the auto-updating .appinstaller
#   canary*    -> published pre-release
#   manual run -> draft release, for checking the artifacts before anything goes public
#
# Signing uses Azure Artifact Signing through the `sign` CLI and is skipped when its secrets are
# missing: ARTIFACT_SIGNING_ENDPOINT / _ACCOUNT / _PROFILE and AZURE_TENANT_ID / _CLIENT_ID /
# _CLIENT_SECRET. MSIX packages only install signed, so without them only the zips are released.
#
# Keep the secrets in the `release` environment, limited to v* and canary* tags, so no other
# ref's workflow can read them. They are only ever given to the signing steps, never to a build.
on:
  push:
    tags:
      - 'v*'
      - 'canary*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to build as (used for the archive name only)'
        required: true
        default: 'canary-test'

permissions:
  contents: read

env:
  SIGN_VERSION: 0.9.1-beta.26227.3

jobs:
  version:
    runs-on: ubuntu-latest
    environment: release
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
      stable: ${{ steps.ver.outputs.stable }}
      signed: ${{ steps.ver.outputs.signed }}
    steps:
      # v1.2.3 -> 1.2.3.0; anything else (canaries, manual runs) -> 0.0.<run number>.0
      - name: Resolve tag and version
        id: ver
        shell: pwsh
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          HAS_SIGNING: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT != '' }}
        run: |
          $tag = if ($env:EVENT -eq 'workflow_dispatch') { $env:INPUT_TAG } else { $env:REF_NAME }
          if ($tag -notmatch '^[A-Za-z0-9._-]+$') { throw "Unsupported tag name: $tag" }
          $stable = $tag -match '^v(\d+)\.(\d+)\.(\d+)$'
          $version = if ($stable) { "$($Matches[1]).$($Matches[2]).$($Matches[3]).0" } else { "0.0.$env:RUN_NUMBER.0" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "stable=$($stable.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "signed=$($env:HAS_SIGNING.ToLower())" >> $env:GITHUB_OUTPUT

  build:
    name: build-${{ matrix.rid }}
    needs: version
    runs-on: windows-latest
    environment: release
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
    strategy:
      matrix:
        include:
          - rid: win-x64
            platform: x64
          - rid: win-arm64
            platform: ARM64

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install sign CLI
        if: needs.version.outputs.signed == 'true'
        run: dotnet tool update sign --tool-path "${{ runner.temp }}/sign-tool" --version ${{ env.SIGN_VERSION }}

      - name: Publish (unpackaged)
        run: >
          dotnet publish RoundedTB/RoundedTB.csproj
          -c Release -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }}
          -p:PublishTrimmed=true
          -p:Version=${{ env.VERSION }}
          -p:DebugType=none
          -o publish/RoundedTB

      - name: Sign binaries
        if: needs.version.outputs.signed == 'true'
        shell: pwsh
        env:
          ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: >
          & "${{ runner.temp }}/sign-tool/sign.exe" code artifact-signing
          --artifact-signing-endpoint $env:ARTIFACT_SIGNING_ENDPOINT
          --artifact-signing-account $env:ARTIFACT_SIGNING_ACCOUNT
          --artifact-signing-certificate-profile $env:ARTIFACT_SIGNING_PROFILE
          --file-digest SHA256 --timestamp-url http://timestamp.acs.microsoft.com/ --timestamp-digest SHA256
          --base-directory publish/RoundedTB
          RoundedTB.exe RoundedTB.dll RoundedTB.Tap.dll

      - name: Archive
        shell: pwsh
        run: Compress-Archive -Path publish/RoundedTB -DestinationPath "RoundedTB_${env:TAG}_${{ matrix.rid }}.zip"

      # Left unsigned: the bundle job combines both architectures and signs the bundle.
      - name: Publish (MSIX)
        if: needs.version.outputs.signed == 'true'
        shell: pwsh
        run: |
          $manifest = 'RoundedTB/Package.appxmanifest'
          (Get-Content $manifest -Raw) -replace '(<Identity[^>]*Version=")[^"]*', "`${1}$env:VERSION" | Set-Content $manifest -NoNewline
          dotnet publish RoundedTB/RoundedTB.csproj `
            -c Release -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }} `
            -p:PublishTrimmed=true `
            -p:Version=$env:VERSION `
            -p:DebugType=none `
            -p:WindowsPackageType=MSIX `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxBundle=Never `
            -p:AppxPackageSigningEnabled=false `
            -p:AppxPackageDir="$PWD/msix/"
          New-Item -ItemType Directory -Force packages | Out-Null
          Get-ChildItem msix -Recurse -Filter *.msix | Copy-Item -Destination "packages/RoundedTB_${{ matrix.rid }}.msix"

      - name: Upload archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zip-${{ matrix.rid }}
          path: RoundedTB_*_${{ matrix.rid }}.zip
          if-no-files-found: error

      - name: Upload package
        if: needs.version.outputs.signed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: msix-${{ matrix.rid }}
          path: packages/*.msix
          if-no-files-found: error

  bundle:
    needs: [version, build]
    if: needs.version.outputs.signed == 'true'
    runs-on: windows-latest
    environment: release
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Install sign CLI
        run: dotnet tool update sign --tool-path "${{ runner.temp }}/sign-tool" --version ${{ env.SIGN_VERSION }}

      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: msix-*
          path: packages
          merge-multiple: true

      - name: Bundle
        shell: pwsh
        run: |
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName | Select-Object -Last 1
          New-Item -ItemType Directory -Force out | Out-Null
          & $makeappx.FullName bundle /o /d packages /bv $env:VERSION /p "out/RoundedTB_$env:TAG.msixbundle"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Sign bundle
        shell: pwsh
        env:
          ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: >
          & "${{ runner.temp }}/sign-tool/sign.exe" code artifact-signing
          --artifact-signing-endpoint $env:ARTIFACT_SIGNING_ENDPOINT
          --artifact-signing-account $env:ARTIFACT_SIGNING_ACCOUNT
          --artifact-signing-certificate-profile $env:ARTIFACT_SIGNING_PROFILE
          --file-digest SHA256 --timestamp-url http://timestamp.acs.microsoft.com/ --timestamp-digest SHA256
          --base-directory out
          "RoundedTB_$env:TAG.msixbundle"

      # Installs read the .appinstaller from the latest release to find updates, so only stable
      # releases carry one; pre-releases never become "latest".
      - name: Write .appinstaller
        if: needs.version.outputs.stable == 'true'
        shell: pwsh
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          [xml]$manifest = Get-Content RoundedTB/Package.appxmanifest
          $identity = $manifest.Package.Identity
          $base = "https://github.com/$env:REPOSITORY/releases"
          @"
          <?xml version="1.0" encoding="utf-8"?>
          <AppInstaller xmlns="http://schemas.microsoft.com/appx/appinstaller/2018" Version="$env:VERSION" Uri="$base/latest/download/RoundedTB.appinstaller">
            <MainBundle Name="$($identity.Name)" Publisher="$($identity.Publisher)" Version="$env:VERSION" Uri="$base/download/$env:TAG/RoundedTB_$env:TAG.msixbundle" />
            <UpdateSettings>
              <OnLaunch HoursBetweenUpdateChecks="24" />
              <AutomaticBackgroundTask />
            </UpdateSettings>
          </AppInstaller>
          "@ | Set-Content out/RoundedTB.appinstaller -Encoding utf8

      - name: Upload bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundle
          path: out/*
          if-no-files-found: error

  release:
    name: create-release
    needs: [version, build, bundle]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.bundle.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # creating the release; everything else stays read-only
    env:
      TAG: ${{ needs.version.outputs.tag }}

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.TAG }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: ${{ startsWith(env.TAG, 'canary') }}
          generate_release_notes: true
          body: |
            | Download | For |
            |---|---|
            | `RoundedTB.appinstaller` | Install and keep RoundedTB up to date automatically (stable releases) |
            | `RoundedTB_${{ env.TAG }}.msixbundle` | Install this version as a package |
            | `RoundedTB_${{ env.TAG }}_win-x64.zip` | Portable, most PCs (Intel / AMD) |
            | `RoundedTB_${{ env.TAG }}_win-arm64.zip` | Portable, Windows on Arm (Snapdragon etc.) |

            Everything is self-contained; no .NET or Windows App SDK runtime is needed. For the portable
            builds, extract the whole `RoundedTB` folder and run `RoundedTB.exe`.
          files: |
            RoundedTB_*.zip
            RoundedTB_*.msixbundle
            RoundedTB.appinstaller
          fail_on_unmatched_files: false
